<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🏸 羽球活動 通知設定</title>
</head>

<body>

  <h1>🏸 羽球活動</h1>

  <p>
    普通用户通知設定
  </p>

  <label for="contactValue">
    ユーザーコード（ContactValue）
  </label>

  <input
    type="text"
    id="contactValue"
    placeholder="ContactValueを入力してください"
    autocomplete="off"
  >

  <br><br>

  <button
    id="notificationButton"
    type="button"
  >
    🔔 通知を有効にする
  </button>

  <p id="status"></p>

</body>

</html>
